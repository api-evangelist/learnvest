aid: learnvest
name: LearnVest
description: 'LearnVest was a New York personal-finance company founded in 2009 by Alexa
  von Tobel and backed by Accel, selling subscription financial planning that paired
  consumers with CFP professionals alongside budgeting, spending-tracking and goal
  tools. Northwestern Mutual acquired LearnVest in 2015 for a reported $250 million
  and terminated the subscription planning service on June 5, 2018, closing all client
  accounts. The brand was relaunched as a consumer financial-education content site,
  and learnvest.com today is an archived article library on budgeting, saving, paying
  off debt and career growth, operated under the Northwestern Mutual brand. LearnVest
  never published a public API, developer portal, SDK or sandbox, and no developer
  surface exists today.'
